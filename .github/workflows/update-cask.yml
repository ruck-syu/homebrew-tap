name: Update Voxi cask

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-voxi-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cask from the latest Voxi release
        run: python3 scripts/update-cask.py
      - name: Commit and push if the release changed
        run: |
          if git diff --quiet -- Casks/voxi.rb; then
            echo "Cask is already current."
            exit 0
          fi
          version=$(grep '^  version ' Casks/voxi.rb | cut -d '"' -f 2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/voxi.rb
          git commit -m "voxi: update to $version"
          git push
